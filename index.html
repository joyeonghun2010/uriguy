<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @font-face {
            font-family: 'GangwonEducationTteontteon';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEduPowerExtraBoldA.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        body {
            background-color: blanchedalmond;
            font-family: 'GangwonEducationTteontteon', sans-serif;
        }

        .login {
            position: absolute;
            right: 7rem;
            top: 1rem;
            height: 50px;
            width: 80px;
            border-radius: 10px;
            border: 1px solid black;
            background-color: lightcyan;
            cursor: pointer;
            font-family: 'GangwonEducationTteontteon', sans-serif;
        }

        .register {
            position: absolute;
            right: 1rem;
            top: 1rem;
            height: 50px;
            width: 80px;
            border-radius: 10px;
            border: 1px solid black;
            background-color: lightcyan;
            cursor: pointer;
            font-family: 'GangwonEducationTteontteon', sans-serif;
        }

        button:hover {
            background-color: lightblue;
        }
        .text {
            color: black;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1 class="text">우리가이</h1>
    <h2 class="text">당신의 짝을 찾아드립니다</h2>
    <button class="login">로그인</button>
    <button class="register">회원가입</button>
    <div class="">

    </div>
</body>

</html>
