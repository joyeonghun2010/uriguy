<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: white;
            box-sizing: border-box;
            margin: 0;
        }

        h1{
            color: #5B6EF5;
            font-weight: 900;
            text-shadow: 1px 0 0 currentColor;
        }

        .login{
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            width: 400px;
            height: 500px;
            margin: 40px auto;
            border-radius: 20px;
        }

        input{
            width: 355px;
            border-radius: 10px;
            border: 1px solid black;
            height: 30px;
            margin-left: 20px;
        }
        h1{
            text-align: center;
            padding-top: 20px;
        }

        h3{
            padding-left: 20px;
            margin-bottom: 5px;
        }

        #id{
            margin-bottom: 20px;
        }

        .check{
            display: flex;
            align-items: center;
            gap: 10px
        }

        .check input{
            cursor: pointer;
            width: 20px;
            height: 20px;
            margin-top: 10px;
            margin-right: 0;
        }

        .check p{
            margin-top: 27px;
        }

        #log_btn{
            background-color: black;
            color: white;
            font-size: 20px;
            font-weight: bold;
            width: 355px;
            height: 50px;
            margin: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        #register_btn{
            background-color: white;
            color: black;
            font-size: 20px;
            font-weight: bold;
            width: 355px;
            height: 50px;
            margin: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        #log_btn:hover{
            transform: translateY(-5px);
        }

        #register_btn:hover{
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="login">
    <h1>UriGuy</h1>
    <div id="id">
        <h3>아이디</h3>
        <input type="text" id="id" name="id" placeholder="아이디를 입력하세요.">
    </div>
    <div id="password">
        <h3>비밀번호</h3>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요.">
    </div>
    <label class="check">
        <input type="checkbox">
        <p>로그인 유지</p>
    </label>
    <button id="log_btn">로그인</button>
    <button id="register_btn">회원가입</button>
</body>
</html>
